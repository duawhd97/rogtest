<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual ROG Renderer — Sample</title>
  <script src="./vrog-renderer-improved.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f5f9; --surface: #fff; --border: #e2e5ef;
      --accent: #09263f; --text: #1a1b2e; --muted: #6b7280;
      --danger: #dc2626;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
    }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }

    h1 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

    /* Query form */
    .form-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
      margin-bottom: 24px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .field input {
      padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; width: 180px;
    }
    .field input:focus { outline: 1px solid var(--accent); }
    .btn {
      padding: 8px 18px; border-radius: 7px; border: none;
      background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.secondary {
      background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 400;
    }
    .btn.secondary:hover { background: rgba(0,0,0,0.04); }

    /* Error banner */
    .error-bar {
      background: rgba(220,38,38,0.08); border: 1px solid var(--danger); border-radius: 8px;
      padding: 10px 14px; color: var(--danger); font-size: 12px; margin-bottom: 16px; display: none;
    }

    /* Main panels */
    .panels { display: flex; gap: 16px; }
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; flex: 1; min-width: 0;
    }
    .panel-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .panel-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .panel-body { padding: 14px 18px; }

    /* Background color toggle swatches */
    .bg-toggle { display: flex; gap: 4px; }
    .bg-swatch {
      width: 20px; height: 16px; border-radius: 3px; border: 1.5px solid var(--border);
      cursor: pointer; transition: border-color .15s, transform .15s;
    }
    .bg-swatch:hover, .bg-swatch.active { border-color: var(--accent); transform: scale(1.08); }
    .bg-swatch.dark  { background: #111; }
    .bg-swatch.light { background: #e0e2e8; }
    .bg-swatch.white { background: #fff; }

    /* VROG canvas wrapper */
    .vrog-wrap {
      background: #e8eaef; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; min-height: 180px; overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.06);
      transition: background 0.25s ease;
    }
    .vrog-wrap.dark-bg { background: #15171c; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }
    .vrog-wrap.white-bg { background: #ffffff; box-shadow: inset 0 0 20px rgba(0,0,0,0.04); }

    /* Product list panel */
    .product-panel { width: 280px; flex-shrink: 0; }
    .list-section { margin-bottom: 12px; }
    .list-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
    }
    .count-badge {
      background: rgba(0,0,0,0.06); border-radius: 10px; padding: 1px 7px;
      font-size: 10px; font-weight: 600; color: var(--muted);
    }
    .product-list { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }
    .product-row {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      border-radius: 6px; cursor: default; transition: background .1s;
    }
    .product-row:hover { background: rgba(9,38,63,0.06); }
    .product-code { font-size: 10px; color: var(--muted); font-family: monospace; flex-shrink: 0; }
    .product-name { font-size: 12px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-badge {
      font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 10px; flex-shrink: 0;
      text-transform: uppercase;
    }
    .s-oos { background: #fee2e2; color: #b91c1c; }
    .s-ls  { background: #fef9c3; color: #92400e; }
    .s-mis { background: #ede9fe; color: #5b21b6; }

    .empty-msg { color: var(--muted); font-size: 12px; padding: 8px 0; }

    /* Loading status bar */
    .status-bar {
      margin-bottom: 16px; font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 10px;
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Virtual ROG Renderer — Sample</h1>

  <!-- Query form -->
  <div class="form-card">
    <div class="field">
      <label>Company</label>
      <input id="inp-company" type="text" placeholder="e.g. SDM" value="SDM" />
    </div>
    <div class="field">
      <label>Store</label>
      <input id="inp-store" type="text" placeholder="e.g. SDM" value="SDM" />
    </div>
    <div class="field">
      <label>Shelf ID</label>
      <input id="inp-shelf" type="text" placeholder="e.g. A02-001" value="A02-001" />
    </div>
    <button class="btn" id="btn-fetch" onclick="fetchAndRender()">Search</button>
    <button class="btn secondary" id="btn-clear" onclick="clearAll()" style="display:none">Clear</button>
  </div>

  <div class="error-bar" id="error-bar"></div>
  <div class="status-bar" id="status-bar" style="display:none">
    <div class="spinner"></div><span id="status-text">Loading…</span>
  </div>

  <!-- Result panels — hidden until data is loaded -->
  <div id="main-content" style="display:none">
    <div class="panels">
      <!-- Reference ROG panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Reference ROG</span>
          <div class="bg-toggle" id="rog-bg-toggle">
            <div class="bg-swatch dark  active" onclick="setBg('rog','#000000',this)"></div>
            <div class="bg-swatch light"        onclick="setBg('rog','#ffffff',this)"></div>
          </div>
        </div>
        <div class="panel-body">
          <div class="vrog-wrap" id="rog-container"></div>
        </div>
      </div>

      <!-- Current shelf state panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Current State</span>
          <div class="bg-toggle" id="shelf-bg-toggle">
            <div class="bg-swatch dark  active" onclick="setBg('shelf','#000000',this)"></div>
            <div class="bg-swatch light"        onclick="setBg('shelf','#ffffff',this)"></div>
          </div>
        </div>
        <div class="panel-body">
          <div class="vrog-wrap" id="shelf-container"></div>
        </div>
      </div>

      <!-- Product list -->
      <div class="panel product-panel">
        <div class="panel-header">
          <span class="panel-title">Products</span>
        </div>
        <div class="panel-body">
          <div class="list-section">
            <div class="list-title">
              All Products
              <span class="count-badge" id="all-count">0</span>
            </div>
            <div class="product-list" id="all-list"></div>
          </div>
          <div class="list-section">
            <div class="list-title">
              Alerts
              <span class="count-badge" id="alert-count">0</span>
            </div>
            <div class="product-list" id="alert-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE  = 'https://asia.common.solumesl.com/vision/api/v2/common/visions';
    const API_TOKEN = 'eyJhbGciOiJSUzI1NiIsImtpZCI6Ilg1ZVhrNHh5b2pORnVtMWtsMll0djhkbE5QNC1jNTdkTzZRR1RWQndhTmsiLCJ0eXAiOiJKV1QifQ.eyJhdWQiOiJlMDhlNTRmZi01YmIxLTRhZTctYWZkZS1iOWNkYzhmYTIzYWUiLCJpc3MiOiJodHRwczovL3NvbHVtYjJjLmIyY2xvZ2luLmNvbS9iMGM4ZTNkOS0wOGZhLTQ4N2EtYWZmMS04NWJhZTExZmM2YzUvdjIuMC8iLCJleHAiOjE3NzgxMzA3NzksIm5iZiI6MTc3ODA0NDM3OSwiaWRwIjoiTG9jYWxBY2NvdW50Iiwib2lkIjoiN2ViMjY0ZGYtN2NiZS00ZmJhLTk5NTktMWM1NjEzMDhiYjA4Iiwic3ViIjoiN2ViMjY0ZGYtN2NiZS00ZmJhLTk5NTktMWM1NjEzMDhiYjA4IiwibmFtZSI6Inl1bmJpbi5jaGFuZyIsIm5ld1VzZXIiOmZhbHNlLCJleHRlbnNpb25fQWRtaW5BcHByb3ZlZCI6dHJ1ZSwiZXh0ZW5zaW9uX0N1c3RvbWVyQ29kZSI6IlNPTFVNIiwiZXh0ZW5zaW9uX0N1c3RvbWVyTGV2ZWwiOiIxIiwiZXh0ZW5zaW9uX1JlYWRPbmx5IjpmYWxzZSwiZXh0ZW5zaW9uX2VtYWlsQ29uZmlnIjoiMDAwMDAwMDAwMDAwIiwiZXh0ZW5zaW9uX3RuYyI6dHJ1ZSwiZXh0ZW5zaW9uX21mYSI6dHJ1ZSwiZW1haWxzIjpbInl1bmJpbi5jaGFuZ0Bzb2x1LW0uY29tIl0sInRmcCI6IkIyQ18xX1JPUENfQXV0aCIsImF6cCI6ImUwOGU1NGZmLTViYjEtNGFlNy1hZmRlLWI5Y2RjOGZhMjNhZSIsInZlciI6IjEuMCIsImlhdCI6MTc3ODA0NDM3OX0.JNruFy3XHfqp4UrORClbyA_5BkRXe9lu_IwPPeedLuI5COZDkpgjXoZPs6aEyWYKUFdg6ZGkPzNeI3jr9Ocm9gO0xjAXemLsWFk09Q2R0Af1XrLmsEU__UOft06PYZeGd_KnTqlateDu_bu7mkD8CJC27i5iSiE-rfjby5X0SQMZ2mbKT32Q20Uk5E7bovuMA4ePGS54LcydbTStY_uYz-gNbQWaFaPToC1GbjRR7RTztXanl6RYFsf28U4zozVfz1XtSqlrffzLM3jna-zDvmaZC55SXlDkFra5x1lzg1_8CcG4oGNzY7lMqdB9ry1MHMAKO052XTnqpE_mJREx_A';

    const ALERT_SET = new Set(['oos', 'ls', 'mis']);

    let rogRenderer   = null;
    let shelfRenderer = null;
    let currentDetail = null;

    function setStatus(msg) {
      const bar = document.getElementById('status-bar');
      if (msg) { bar.style.display = 'flex'; document.getElementById('status-text').textContent = msg; }
      else        bar.style.display = 'none';
    }

    function setError(msg) {
      const el = document.getElementById('error-bar');
      if (msg) { el.style.display = 'block'; el.textContent = msg; }
      else        el.style.display = 'none';
    }

    async function fetchAndRender() {
      const company = document.getElementById('inp-company').value.trim();
      const store   = document.getElementById('inp-store').value.trim();
      const shelfId = document.getElementById('inp-shelf').value.trim();
      if (!company || !store || !shelfId) { setError('Please fill in Company, Store, and Shelf ID.'); return; }

      setError('');
      setStatus('Calling Vision API…');
      document.getElementById('btn-fetch').disabled = true;
      document.getElementById('main-content').style.display = 'none';

      try {
        const url = `${API_BASE}/operation/history/detail` +
          `?company=${encodeURIComponent(company)}&store=${encodeURIComponent(store)}` +
          `&shelfId=${encodeURIComponent(shelfId)}&floor=1F&page=0&size=10`;

        const res  = await fetch(url, { headers: { 'Authorization': `Bearer ${API_TOKEN}` } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

        const detail = (data.operationHistoryInfoList || [])[0];
        if (!detail) { setError('No data found. Please check the Shelf ID.'); setStatus(''); return; }

        currentDetail = detail;
        setStatus('Rendering canvas…');
        await renderAll(detail);

        document.getElementById('main-content').style.display = 'block';
        document.getElementById('btn-clear').style.display = '';
        setStatus('');
      } catch (e) {
        setError('API error: ' + e.message);
        setStatus('');
      } finally {
        document.getElementById('btn-fetch').disabled = false;
      }
    }

    async function renderAll(detail) {
      const si = detail.rogShelfInfo || [];

      // Reference ROG canvas
      if (rogRenderer) rogRenderer.destroy();
      rogRenderer = new VROGRenderer(
        document.getElementById('rog-container'),
        detail.rogImage,
        si,
        '#eaecf1'
      );
      await rogRenderer.render();

      // Current shelf state canvas
      if (shelfRenderer) shelfRenderer.destroy();
      shelfRenderer = new VROGRenderer(
        document.getElementById('shelf-container'),
        detail.shelfImage,
        si,
        '#eaecf1'
      );
      await shelfRenderer.render();

      buildProductLists(detail);
    }

    function buildProductLists(detail) {
      // All products — derived from rogShelfInfo (reference state)
      const allMap = new Map();
      for (const row of (detail.rogShelfInfo || [])) {
        for (const c of (row || [])) {
          if (!c) continue;
          const lc = c.esl_info?.[0]?.label_code || '';
          const an = c.prd_info?.[0]?.article_name || '';
          const k  = lc || String(allMap.size);
          if (!allMap.has(k)) allMap.set(k, { labelCode: lc, articleName: an });
        }
      }
      const allProducts = [...allMap.values()];

      // Alert products — derived from shelfInfo (current state, OOS/LS/MIS only)
      const alertProducts = [];
      for (const row of (detail.shelfInfo || [])) {
        for (const c of (row || [])) {
          if (!c) continue;
          const status = (c.status || '').toLowerCase();
          if (ALERT_SET.has(status)) alertProducts.push({
            labelCode:   c.eslInfo?.[0]?.labelCode || '',
            articleName: c.articleName || '',
            status,
          });
        }
      }

      // Hover on "All Products" highlights the ROG canvas
      renderProductList('all-list',   'all-count',   allProducts,   'rog');
      // Hover on "Alerts" highlights the current shelf canvas
      renderProductList('alert-list', 'alert-count', alertProducts, 'shelf');
    }

    function renderProductList(listId, countId, products, highlightTarget) {
      document.getElementById(countId).textContent = products.length;
      const el = document.getElementById(listId);

      if (!products.length) {
        el.innerHTML = '<div class="empty-msg">None</div>';
        return;
      }

      el.innerHTML = '';
      for (const p of products) {
        const row = document.createElement('div');
        row.className = 'product-row';

        const badgeHtml = p.status
          ? `<span class="status-badge s-${p.status}">${p.status.toUpperCase()}</span>`
          : '';

        row.innerHTML =
          `<span class="product-code">${escHtml(p.labelCode || '—')}</span>` +
          `<span class="product-name">${escHtml(p.articleName || '—')}</span>` +
          badgeHtml;

        row.addEventListener('mouseenter', () => {
          if (highlightTarget === 'rog'   && rogRenderer)   rogRenderer.highlightByKey(p.labelCode);
          if (highlightTarget === 'shelf' && shelfRenderer) shelfRenderer.highlightByKey(p.labelCode);
        });
        row.addEventListener('mouseleave', () => {
          if (rogRenderer)   rogRenderer.clearHighlight();
          if (shelfRenderer) shelfRenderer.clearHighlight();
        });

        el.appendChild(row);
      }
    }

    async function setBg(target, color, swatchEl) {
      // Update active swatch indicator
      const toggleId = target === 'rog' ? 'rog-bg-toggle' : 'shelf-bg-toggle';
      document.getElementById(toggleId).querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
      swatchEl.classList.add('active');

      // Sync wrapper background
      const wrap = document.getElementById(target === 'rog' ? 'rog-container' : 'shelf-container');
      wrap.className = 'vrog-wrap';
      if (color === '#1a1c22') wrap.classList.add('dark-bg');
      else if (color === '#ffffff') wrap.classList.add('white-bg');

      const renderer = target === 'rog' ? rogRenderer : shelfRenderer;
      if (renderer) await renderer.setBackgroundColor(color);
    }

    function clearAll() {
      if (rogRenderer)   { rogRenderer.destroy();  rogRenderer   = null; }
      if (shelfRenderer) { shelfRenderer.destroy(); shelfRenderer = null; }
      currentDetail = null;
      document.getElementById('main-content').style.display = 'none';
      document.getElementById('btn-clear').style.display = 'none';
      setError('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Submit on Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') fetchAndRender();
    });

    // Auto-fetch with default values on page load
    document.addEventListener('DOMContentLoaded', () => fetchAndRender());
  </script>
</body>
</html>
